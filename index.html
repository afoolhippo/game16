<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>石炭掘って</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
</head>

<body>

<div id="titleScreen" class="screen active">

    <img src="title.png" id="titleImage">

    <div class="ruleBox">
        地下へ地下へ掘り進め！<br>
        石炭を集めて高得点を目指そう。<br>
        固い岩は壊せないぞ。
    </div>

    <button id="startBtn">タップしてスタート</button>

</div>

<div id="gameScreen" class="screen">

    <div id="hud">

        <div>深さ <span id="depth">0</span>m</div>
        <div>石炭 <span id="coal">0</span></div>

    </div>

    <canvas id="gameCanvas" width="320" height="480"></canvas>

</div>

<div id="resultScreen" class="screen">

    <div id="rankTitle"></div>

    <img id="rankImage" src="">

    <div id="finalScore"></div>

    <button id="shareBtn">Xでシェア</button>

    <button id="retryBtn">もう一回掘る</button>

    <button id="homeBtn">タイトルへ</button>

</div>

<script src="game.js"></script>

</body>
</html>
